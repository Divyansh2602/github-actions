name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two variants — light + dark — themed to the DIVYANSH://VOID
      # cyan/ice palette used across the portfolio and profile README.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0e7490&color_dots=#ebedf0,#bae6fd,#7dd3fc,#22d3ee,#0e7490
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4a5e,#0e7490,#22d3ee,#7dd3fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The new snake is on the output branch, but the profile will keep
      # rendering the cached copy until GitHub's image proxy is purged.
      - name: Refresh GitHub image cache
        run: |
          chmod +x scripts/purge-camo.sh
          ./scripts/purge-camo.sh "${{ github.repository_owner }}"
